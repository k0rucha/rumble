<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Rumble mail app icon</title>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0.18" y2="1">
      <stop offset="0%" stop-color="#48ACFF"/>
      <stop offset="48%" stop-color="#2166ED"/>
      <stop offset="100%" stop-color="#3028C7"/>
    </linearGradient>
    <linearGradient id="envelope" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C9E3FF"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A9D0FF"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C9E4FF"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="iconClip">
      <rect x="118" y="118" width="788" height="788" rx="238"/>
    </clipPath>
  </defs>

  <!-- Rounded gradient tile (余白は透過。元の白い全面背景は Dock で白い四角になるため外している) -->
  <rect x="118" y="118" width="788" height="788" rx="238" fill="url(#background)"/>

  <g clip-path="url(#iconClip)">
    <!-- Subtle top sheen -->
    <ellipse cx="500" cy="180" rx="470" ry="250" fill="url(#shine)" opacity="0.42"/>

    <!-- R-like flowing ribbon behind the envelope -->
    <path d="M 392,278
             C 382,278 382,286 389,300
             L 407,330
             C 417,347 432,353 454,353
             L 568,353
             C 620,353 646,373 646,407
             C 646,443 622,463 584,463
             C 557,463 535,449 505,449
             C 474,449 450,463 421,480
             C 393,497 367,510 336,510
             C 303,510 279,494 258,480
             C 246,472 235,481 235,500
             L 235,533
             C 270,561 300,574 337,574
             C 385,574 420,553 454,535
             C 483,519 505,510 527,510
             C 553,510 574,526 595,546
             L 635,581
             C 652,596 670,593 685,578
             L 705,557
             C 685,539 661,519 639,501
             C 685,485 714,448 714,404
             C 714,337 664,278 587,278
             Z"
          fill="url(#ribbon)"/>

    <!-- Envelope body shadow -->
    <path d="M 202,457
             L 512,660
             L 822,457
             L 822,710
             C 822,765 787,797 731,797
             L 293,797
             C 237,797 202,765 202,710 Z"
          fill="#091C85" opacity="0.28" filter="url(#softShadow)"/>

    <!-- Envelope front body -->
    <path d="M 200,447
             C 200,431 214,429 229,441
             L 488,633
             C 503,644 521,644 536,633
             L 795,441
             C 810,429 824,431 824,447
             L 824,706
             C 824,764 788,791 732,791
             L 292,791
             C 236,791 200,764 200,706 Z"
          fill="url(#envelope)"/>

    <!-- Soft blue fold shading -->
    <path d="M 200,447
             L 488,633
             C 503,644 521,644 536,633
             L 824,447
             L 824,472
             L 536,679
             C 521,690 503,690 488,679
             L 200,472 Z"
          fill="url(#flap)" opacity="0.76"/>

    <!-- Gentle lower-face reflection -->
    <path d="M 254,706
             C 370,741 650,741 770,704
             L 770,739
             C 770,765 750,778 719,778
             L 305,778
             C 275,778 254,761 254,734 Z"
          fill="#FFFFFF" opacity="0.12"/>

    <!-- Very subtle top edge highlight -->
    <path d="M 222,446
             L 499,635
             C 507,640 517,640 525,635
             L 802,446"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.62" stroke-width="4"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
